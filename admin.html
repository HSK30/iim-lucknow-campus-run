<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Campus Sprint Admin</title>
<style>
  :root { --bg:#14110f; --panel:#1e1916; --line:#3a2f29; --cream:#f6ecd9; --dim:#b9a995; --maroon:#8b1e1e; --gold:#ffd25e; --ok:#7ad39a; --bad:#ff7a8a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--cream); font: 15px/1.45 "Courier New", Courier, monospace;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 26px; letter-spacing: .06em; text-transform: uppercase; }
  h1 span { color: var(--gold); }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .meta { color: var(--dim); font-size: 13px; }
  button, input { font: inherit; }
  button { background: var(--maroon); color: var(--cream); border: 2px solid var(--cream); padding: 8px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; font-size: 13px; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--dim); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  input { background: #0e0c0a; color: var(--cream); border: 2px solid var(--line); padding: 10px 12px; width: 100%; }
  .login { max-width: 380px; margin: 14vh auto 0; background: var(--panel); border: 2px solid var(--line); padding: 24px; display: grid; gap: 14px; }
  .login p { color: var(--dim); font-size: 13px; }
  .err { color: var(--bad); min-height: 1.4em; font-size: 13px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .tile { background: var(--panel); border: 2px solid var(--line); padding: 12px 14px; }
  .tile b { display: block; font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .tile span { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar input { max-width: 260px; }
  .tabs { display: flex; gap: 6px; margin-right: auto; }
  .tabs button { background: transparent; border-color: var(--line); color: var(--dim); }
  .tabs button[aria-pressed="true"] { background: var(--maroon); border-color: var(--cream); color: var(--cream); }
  .scroll { overflow-x: auto; border: 2px solid var(--line); background: var(--panel); }
  table { width: 100%; border-collapse: collapse; min-width: 640px; font-variant-numeric: tabular-nums; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; position: sticky; top: 0; background: var(--panel); }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tr.gold td:first-child { color: var(--gold); font-weight: 700; }
  .empty { padding: 28px; text-align: center; color: var(--dim); }
  .pill { display: inline-block; padding: 1px 8px; border: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .live { color: var(--ok); }
  .live.off { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <form id="login" class="login" autocomplete="off">
    <h1>Campus Sprint <span>Admin</span></h1>
    <p>Enter the admin password to see players, scores and the leaderboard.</p>
    <label for="pw" class="meta">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr" role="alert"></div>
    <button type="submit" id="loginBtn">Open dashboard</button>
  </form>

  <div id="app" hidden>
    <div class="top">
      <h1>Campus Sprint <span>Admin</span></h1>
      <div class="meta"><span id="liveDot" class="live">LIVE</span> | updated <span id="updated">never</span> | <button class="ghost" id="refresh" type="button">Refresh</button> <button class="ghost" id="logout" type="button">Log out</button></div>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="bar">
      <div class="tabs" role="group" aria-label="View">
        <button type="button" data-tab="board" aria-pressed="true">Leaderboard</button>
        <button type="button" data-tab="runs" aria-pressed="false">All runs</button>
        <button type="button" data-tab="players" aria-pressed="false">Sign-ups</button>
      </div>
      <input id="q" type="search" placeholder="Search name" aria-label="Search name">
      <button type="button" class="ghost" id="csv">Export CSV</button>
    </div>

    <div class="scroll"><table id="tbl"></table></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const RANKS = ['Waitlisted', 'Summer Intern', 'Club Convener', "Dean's List", 'Final Placement Offer', 'Gold Medalist'];
  const $ = id => document.getElementById(id);
  let key = '', data = null, tab = 'board', timer = null;
  try { key = sessionStorage.getItem('crAdminKey') || ''; } catch (e) {}

  const fmtSecs = s => { s = Math.round(s); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
  const fmtDate = ts => ts ? new Date(ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function load(showErr) {
    try {
      const r = await fetch('/api?a=admin', { headers: { 'x-admin-key': key }, cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { logout(); $('loginErr').textContent = 'Wrong password.'; return; }
      if (r.status === 503) { $('liveDot').className = 'live off'; if (showErr) $('loginErr').textContent = j.error === 'admin_password_not_set' ? 'Admin password is not set on the server yet.' : 'Storage is not connected yet.'; return; }
      if (!r.ok) throw new Error('bad');
      data = j;
      $('login').hidden = true; $('app').hidden = false;
      $('liveDot').className = 'live'; $('liveDot').textContent = 'LIVE';
      $('updated').textContent = new Date().toLocaleTimeString();
      render();
    } catch (e) {
      $('liveDot').className = 'live off'; $('liveDot').textContent = 'OFFLINE';
    }
  }

  function render() {
    if (!data) return;
    const t = data.totals;
    $('tiles').innerHTML = [
      ['Signed up', t.players], ['Played at least once', t.played], ['Total runs', t.runs],
      ['Top score', t.best], ['Average score', t.avgScore], ['Time played', fmtSecs(t.totalSecs)]
    ].map(([l, v]) => '<div class="tile"><b>' + esc(v) + '</b><span>' + l + '</span></div>').join('');

    const q = $('q').value.trim().toLowerCase();
    const hit = n => !q || n.toLowerCase().includes(q);
    let head, rows, empty = 'Nothing here yet. Share the game link and scores will show up.';
    if (tab === 'board') {
      head = ['#', 'Player', 'Best score', 'Time survived', 'Reached at', 'Persona', 'Runs', 'Last played'];
      rows = data.board.map((p, i) => ({ i, p })).filter(x => hit(x.p.name)).map(({ i, p }) =>
        [i + 1, p.name, p.best, fmtSecs(p.bestSecs), fmtDate(p.bestTs), RANKS[p.bestRank] || '-', p.runs, fmtDate(p.lastRun)]);
    } else if (tab === 'runs') {
      head = ['When', 'Player', 'Score', 'Time', 'Distance (m)', 'Snacks', 'Laps', 'Persona'];
      rows = data.recent.filter(r => hit(r.name)).map(r => [fmtDate(r.ts), r.name, r.score, fmtSecs(r.secs), r.dist, r.snacks, r.lap, RANKS[r.rank] || '-']);
    } else {
      head = ['Player', 'Signed up', 'Runs', 'Best score'];
      rows = data.players.filter(p => hit(p.name)).map(p => [p.name, fmtDate(p.joined), p.runs, p.runs ? p.best : '-']);
    }
    const numCols = new Set(tab === 'board' ? [0, 2, 6] : tab === 'runs' ? [2, 4, 5, 6] : [2, 3]);
    $('tbl').innerHTML = rows.length
      ? '<thead><tr>' + head.map((h, i) => '<th' + (numCols.has(i) ? ' class="num"' : '') + '>' + h + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map((r, ri) => '<tr' + (tab === 'board' && ri < 3 && !q ? ' class="gold"' : '') + '>' + r.map((c, i) => '<td' + (numCols.has(i) ? ' class="num"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody>'
      : '<tbody><tr><td class="empty">' + empty + '</td></tr></tbody>';
    $('tbl')._csv = [head].concat(rows);
  }

  function csv() {
    const rows = $('tbl')._csv || [];
    const text = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' }));
    a.download = 'campus-sprint-' + tab + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function logout() {
    key = ''; try { sessionStorage.removeItem('crAdminKey'); } catch (e) {}
    clearInterval(timer); data = null;
    $('app').hidden = true; $('login').hidden = false; $('pw').value = '';
  }

  $('login').addEventListener('submit', async e => {
    e.preventDefault();
    key = $('pw').value; $('loginErr').textContent = ''; $('loginBtn').disabled = true;
    await load(true);
    $('loginBtn').disabled = false;
    if (data) {
      try { sessionStorage.setItem('crAdminKey', key); } catch (e2) {}
      clearInterval(timer); timer = setInterval(() => load(false), 15000);
    }
  });
  $('refresh').addEventListener('click', () => load(false));
  $('logout').addEventListener('click', logout);
  $('csv').addEventListener('click', csv);
  $('q').addEventListener('input', render);
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    render();
  }));

  if (key) { load(false).then(() => { if (data) timer = setInterval(() => load(false), 15000); }); }
})();
</script>
</body>
</html>
